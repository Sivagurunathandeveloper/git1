<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Header</title>
   <style>
    body{
    margin:0;
    font-family:Arial, sans-serif;
}

header{
    display:flex;
    justify-content:space-between;
    background-color: rgb(92, 92, 92);
     padding: 15px 40px;
     align-items:center;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
   
}

nav ul{
    list-style:none;
    display: flex;
    margin:0;
    padding:0;
}
nav ul li{
    margin-left:20px;
    
}
nav ul li a{
    text-decoration:none;
    color:white;
    font-size:16px;
}
nav ul li a:hover{
    color:rgb(243, 142, 19);
}

.search-container{
    position:relative;
    width:300px;
    margin:50px;
}
.search-container input{
    width:100%;
    padding:10px 40px 10px 10px;
    border:1px solid #ccc;
    border-radius:20px;
    outline:none;
    display:relative;
}
.search-container button{
    background: none;
    display:absolute;
    top:50%;
    right:10px;
    border:none;
    font-size:16px;
    cursor:pointer;
    transform:translateY(-130%);
    transform:translateX(500%);
   
}
   </style>
</head>

<body>
<header>
    <div class="logo">MyWebsite</div>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Login</a></li>
            <li><a href="#">Service</a></li>
        </ul>
    </nav>
</header>
<center>
<div class="search-container">
   <input type="text" placeholder="Search...">
   <button>🔍</button>
</div>
</center>
</body>
</html>
